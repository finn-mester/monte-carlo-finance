[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfinance"
version = "1.0.0"
description = "Monte Carlo methods in finance: option pricing, variance reduction, exotic options, and VaR/ES with backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "<YOUR NAME>" }]
keywords = [
    "monte-carlo",
    "quantitative-finance",
    "option-pricing",
    "black-scholes",
    "variance-reduction",
    "exotic-options",
    "value-at-risk",
    "expected-shortfall",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["yfinance"]
notebook = ["ipykernel", "nbconvert", "nbformat"]

[project.urls]
Repository = "https://github.com/<GITHUB_USERNAME>/monte-carlo-finance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts and the notebook add src/ to sys.path before importing the package.
"scripts/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
